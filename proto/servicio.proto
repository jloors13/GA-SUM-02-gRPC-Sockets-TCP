syntax = "proto3";

package mensajeria;

service ComunicacionNodos {
  rpc EnviarMensaje(Mensaje) returns (Acuse);
}

message Mensaje {
  string sender = 1;
  int64 timestamp = 2;
  string message = 3;
}

message Acuse {
  string sender = 1;
  int64 received_timestamp = 2;
  int64 timestamp = 3;
  string message = 4;
}
